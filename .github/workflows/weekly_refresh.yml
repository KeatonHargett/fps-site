name: Deploy + weekly refresh (Netlify API, keyless)

# - Any push to main deploys current files to Netlify (no Netlify clone needed).
# - Weekly cron Aug-Jan pulls completed games from ESPN, replaces current
#   season rows, commits, then deploys.
# - Manual dispatch lets you force-deploy or dry-run the refresh. Production deploys
#   only ever run from main, and never on a dry run.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * 8-12 2"
    - cron: "0 12 * 1 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Override season year (optional)"
        required: false
        type: string
      dry_run:
        description: "Dry run refresh (skip commit)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: fps-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Refresh games from ESPN
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FPS_CURRENT_SEASON: ${{ github.event.inputs.season }}
          FPS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          python scripts/refresh_games.py

      - name: Refresh FBS team list from ESPN
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/refresh_fbs_teams.py

      - name: Refresh team schedules from CFBD
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "CFBD_API_KEY not set; skipping schedules refresh."
          else
            python scripts/refresh_schedules.py
          fi

      # Home / away / neutral and head coach for the season's games. Both scripts
      # re-fetch ONLY the current season from CFBD, keep every earlier season from the
      # committed files, and reapply game_sites_overrides.json / coaches_overrides.json
      # on every run. A CFBD error (or a missing key) exits non-zero BEFORE anything is
      # written, so the data files are never replaced with empty or partial output.
      # continue-on-error lets the ESPN data above still commit and deploy; the
      # "Fail if CFBD site/coach refresh failed" step at the end then turns the run red.
      - name: Refresh game sites from CFBD
        id: sites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          FPS_CURRENT_SEASON: ${{ github.event.inputs.season }}
          FPS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          SEASON="$(python -c 'import sys; sys.path.insert(0, "scripts"); from refresh_games import current_season; print(current_season())')"
          echo "Season: $SEASON"
          python scripts/build_game_sites.py --update-season "$SEASON"

      - name: Refresh head coaches from CFBD
        id: coaches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          FPS_CURRENT_SEASON: ${{ github.event.inputs.season }}
          FPS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          SEASON="$(python -c 'import sys; sys.path.insert(0, "scripts"); from refresh_games import current_season; print(current_season())')"
          echo "Season: $SEASON"
          python scripts/build_coaches_data.py --update-season "$SEASON"

      # Runs after the refreshers so it scores against the data they just pulled.
      # Keyless (ESPN only), so unlike the CFBD step it has no secret to skip on.
      - name: Compute featured matchups
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FPS_CURRENT_SEASON: ${{ github.event.inputs.season }}
          FPS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          python scripts/compute_featured.py

      # Slim derived data for the pages (data/derived/), regenerated from the refreshed
      # front_porch_games.json, then proven identical to it. If either step fails the job
      # stops HERE: nothing is committed or deployed, the previous derived files stay in
      # the repo, and the run is red. The parity check also runs on push-to-main deploys,
      # so a data change that skipped the rebuild can never reach production.
      - name: Build derived data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/build_derived_data.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parity check (derived data vs front_porch_games.json)
        run: |
          node scripts/parity_check.js

      - name: Commit refreshed data
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.dry_run != 'true'
        run: |
          CHANGED=""
          if [ -n "$(git status --porcelain front_porch_games.json)" ]; then CHANGED="$CHANGED front_porch_games.json"; fi
          if [ -n "$(git status --porcelain fbs_teams.json)"        ]; then CHANGED="$CHANGED fbs_teams.json"; fi
          if [ -n "$(git status --porcelain schedules_data.json)"   ]; then CHANGED="$CHANGED schedules_data.json"; fi
          if [ -n "$(git status --porcelain featured_matchups.json)" ]; then CHANGED="$CHANGED featured_matchups.json"; fi
          for f in game_sites.json game_venues.json coaches_data.json data/derived; do
            if [ -n "$(git status --porcelain $f)" ]; then CHANGED="$CHANGED $f"; fi
          done
          if [ -n "$CHANGED" ]; then
            git config user.name  "fps-refresh-bot"
            git config user.email "fps-refresh-bot@users.noreply.github.com"
            git add -A $CHANGED
            git commit -m "chore(data): weekly ESPN refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Deploy to Netlify
        # Production only from main, and never on a manual dry run.
        if: github.ref == 'refs/heads/main' && github.event.inputs.dry_run != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx -y netlify-cli@latest deploy \
            --prod \
            --dir . \
            --message "GitHub Actions deploy ${{ github.sha }}" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"

      - name: Fail if CFBD site/coach refresh failed
        if: always() && (steps.sites.outcome == 'failure' || steps.coaches.outcome == 'failure')
        run: |
          echo "::error::CFBD refresh failed (sites: ${{ steps.sites.outcome }}, coaches: ${{ steps.coaches.outcome }}). game_sites.json / game_venues.json / coaches_data.json were left unchanged; see the step logs above."
          exit 1
