# Netlify build configuration for Front Porch Sports.
# Static site, no build step. Publish the repo root.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# HTML must never be cached: the weekly refresh can change what a page renders.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Datasets. Short TTL + revalidate, so a repeat visitor gets a cheap 304 instead
# of re-downloading the payload, but still picks up the weekly refresh promptly.
# Netlify applies no caching by default, so without these every visit refetches
# these files in full.
[[headers]]
  for = "/front_porch_games.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/fbs_teams.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/program_stats.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Season schedules: refreshed weekly in season, so it tracks the games dataset.
[[headers]]
  for = "/schedules_data.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/historical_opponents.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Conference affiliation and coaching tenures change once a season at most, so they
# cache alongside historical_opponents.json rather than the live game data.
[[headers]]
  for = "/conference_history.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/coaching_history.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Home/away/neutral per game (scripts/build_game_sites.py). Rebuilt by hand when the
# history changes, so it caches like the other slow-moving datasets.
[[headers]]
  for = "/game_sites.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Venue name + data source per game, split out of game_sites.json so compare.html
# never downloads it; only games.html reads it.
[[headers]]
  for = "/game_venues.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Head coach(es) per school-season (scripts/build_coaches_data.py), same cadence.
[[headers]]
  for = "/coaches_data.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/upcoming_lines.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Recomputed by the weekly job, so it tracks the other weekly datasets.
[[headers]]
  for = "/featured_matchups.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Hand-maintained rivalry names; changes rarely, like the FBS team list.
[[headers]]
  for = "/rivalries.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Derived data (scripts/build_derived_data.py). Every file except the manifest has a
# content hash in its name, so it can be cached for a year: new data means a new name.
# The manifest points at the current names, so it stays short-lived. The patterns
# below never overlap the manifest rule. Netlify serves JSON brotli-compressed.
[[headers]]
  for = "/data/derived/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/derived/teams/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/derived/teams_index.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/derived/league.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/derived/home.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand images and icons. Filenames are not content-hashed, so this is a week
# rather than a year - long enough to help repeat visits, short enough that a
# logo swap still propagates without a rename.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Netlify has no built-in MIME type for .webmanifest and falls back to
# application/octet-stream, which browsers may refuse to parse as a manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
